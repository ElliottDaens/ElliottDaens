<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="RunTracker : Suivi de course à pied : sorties, records, objectifs, import Strava et GPX, coach IA qui rédige les bilans.">
  <title>RunTracker</title><style>@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;src:url(data:font/woff2;base64,) format('woff2')}.sg{font-family:'Space Grotesk',system-ui,sans-serif;font-style:normal}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;src:url(data:font/woff2;base64,) format('woff2')}.jb{font-family:'JetBrains Mono',ui-monospace,monospace;font-style:normal}</style>
  <style>
    .dot{animation:p 2s ease-in-out infinite} @keyframes p{50%{opacity:.25}}
    .ln{animation:in .45s ease-out backwards} @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
    .cur{animation:b 1.1s steps(1) infinite} @keyframes b{50%{opacity:0}}
    .flow{stroke-dasharray:6 8;animation:f 1.4s linear infinite} @keyframes f{to{stroke-dashoffset:-28}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
