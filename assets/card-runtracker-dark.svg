  <text x="32" y="51" class="jb" font-size="12.5" font-weight="500" letter-spacing="2.0" text-anchor="start"><tspan fill="#D4FF3D">//</tspan><tspan fill="#898D96"> 03 — PRODUIT PERSO</tspan></text>
  <rect x="350" y="32" width="98" height="28" rx="14" fill="#D4FF3D"/><circle class="dot" cx="366" cy="46" r="3.5" fill="#101217"/><text x="377" y="50.5" class="jb" font-size="12" font-weight="600" fill="#101217">En ligne</text>
  <text x="32" y="108" class="sg" font-size="34" font-weight="700" letter-spacing="-1" fill="#F0EEE9">RunTracker</text>
  <text x="32" y="146" class="sg" font-size="16.5" fill="#A9ACB4"><tspan x="32" dy="0">Suivi de course à pied : sorties, records, objectifs,</tspan><tspan x="32" dy="25">import Strava et GPX, coach IA qui rédige les bilans.</tspan></text>
