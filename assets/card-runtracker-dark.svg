<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="RunTracker : Suivi de course à pied : sorties, records, objectifs, import Strava et GPX, coach IA qui rédige les bilans.">
  <title>RunTracker</title>
  <defs>
    <linearGradient id="gc2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/><stop offset=".55" stop-color="#c084fc"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="pc2" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
