      <stop offset="0" stop-color="#818cf8"/><stop offset=".55" stop-color="#c084fc"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="pl" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <style>.s{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace}
    .flow{stroke-dasharray:6 8;animation:f 1.4s linear infinite} @keyframes f{to{stroke-dashoffset:-28}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}</style>
