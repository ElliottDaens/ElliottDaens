name: Stats du profil

# Régénère assets/stats-*.svg chaque nuit (scripts/build_stats.py).
# Secret METRICS_TOKEN : jeton GitHub classique (repo + read:user) pour lire les dépôts privés.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/stats.yml]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Générer les cartes
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          cd scripts
          python3 build_assets.py
          python3 build_stats.py

      - name: Enregistrer si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Stats : mise à jour automatique"
          git push
